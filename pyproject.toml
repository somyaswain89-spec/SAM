[project]
name = "sam-security-platform"
version = "0.1.0"
description = "SAM security exposure management platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.12.4",
  "SQLAlchemy==2.0.44",
  "alembic==1.16.5",
  "psycopg[binary]==3.2.12",
  "argon2-cffi==25.1.0",
  "PyJWT==2.15.1",
  "slowapi==0.1.9",
  "celery==5.5.3",
  "redis==6.4.0",
  "python-multipart==0.0.34",
  "openpyxl==3.1.5",
  "defusedxml==0.7.1",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.16.2",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.14.4",
  "mypy==1.18.2",
  "pip-audit==2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "E501", "S101"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
