name: SAM CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned uv
        run: python -m pip install uv==0.13.9
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run ruff check backend && uv run ruff format --check backend
      - name: MyPy
        run: uv run mypy backend
      - name: Backend tests
        run: uv run pytest backend/tests -q
      - name: Python dependency audit
        run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Frontend dependency audit
        run: npm --prefix frontend audit --audit-level=moderate
      - name: TypeScript
        run: npm --prefix frontend run typecheck
      - name: ESLint
        run: npm --prefix frontend run lint
      - name: Frontend tests
        run: npm --prefix frontend test
      - name: Production build
        run: npm --prefix frontend run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned uv
        run: python -m pip install uv==0.13.9
      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run browser end-to-end journey
        run: npm --prefix frontend run test:e2e
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sam-playwright-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose configuration
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build api worker frontend
